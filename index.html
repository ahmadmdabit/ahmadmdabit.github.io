  <base href="/">
  <style>body{background-color:#000;margin:0;padding:0}.loader-overlay{z-index:9999;background:#000;justify-content:center;align-items:center;transition:opacity .5s .3s,visibility .5s .3s;display:flex;position:fixed;inset:0}.loader-overlay.done{opacity:0;visibility:hidden}.loader{--size:1px;width:calc(48 * var(--size));height:calc(48 * var(--size));display:inline-block;position:relative}.loader:after,.loader:before{content:"";box-sizing:border-box;width:calc(48 * var(--size));height:calc(48 * var(--size));border:calc(2 * var(--size)) solid #0e0;border-radius:50%;animation:2s linear infinite animloader;position:absolute;top:0;left:0}.loader:after{animation-delay:1s}@keyframes animloader{0%{opacity:1;transform:scale(0)}to{opacity:0;transform:scale(1)}}</style>
  <script type="module" crossorigin src="/assets/scripts/chunks/main.CjyACeBz.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/styles/main.8Qqw3U2M.css">
</head>

<body>
  <script>
    let div = document.createElement("div");
    div.className = "loader-overlay";
    div.id = "loaderElement";
    div.setAttribute("aria-hidden", "true");

    let span = document.createElement("span");
    span.className = "loader";

    div.appendChild(span);

    document.body.prepend(div);
  </script>
  <div id="root"><!--app-html--></div>
  <script>
    (function () {
      "use strict";

      var loaderElement = document.getElementById("loaderElement");
      if (!loaderElement) return;

      function hideLoader() {
        loaderElement.classList.add("done");
        loaderElement.setAttribute("aria-hidden", "true");
        var loaderCssTransitionMs = 500;
        var loaderCssDelayMs = 300;
        setTimeout(function () {
          // if (loaderElement.parentNode) {
          //   loaderElement.parentNode.removeChild(loaderElement);
          // }
          loaderElement.remove();
        }, loaderCssTransitionMs + loaderCssDelayMs);
      }

      window.addEventListener("load", function () {
        setTimeout(hideLoader, 390);
      });

      setTimeout(hideLoader, 3000);
    })();
  </script>
</body>

</html>
